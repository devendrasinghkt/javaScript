<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>bat-ball-stump</title>
    <style>
       body{
        text-align: center;
       }
    </style>
</head>
<body>
    <h1>Bat Ball Stump Game</h1>
    <!-- js for Bat -->
    <button onclick=" 
        let computerChoice = generateComputerChoice();
        let resultMsg = getResult('Bat',computerChoice);
        showResult('Bat',computerChoice,resultMsg);
    ">Bat</button>
 
    <!-- js for Ball  -->
    <button onclick="
        computerChoice = generateComputerChoice();
        resultMsg = getResult('Ball',computerChoice);
        showResult('Ball',computerChoice,resultMsg);  
    ">Ball</button>

    <!-- js for Stump -->
    <button onclick="
        computerChoice = generateComputerChoice();
        resultMsg = getResult('Stump',computerChoice);
        showResult('Stump',computerChoice,resultMsg);
    ">Stump</button>


    <Script>
        let score ={
            win: 0,
            loss:0,
            tie: 0,
            displayScore: function(){
                return ` Won : ${score.win}, Lost : ${score.
                loss}, Tie : ${score.tie},`
            }
        };

        function generateComputerChoice(){
        let randomNo = Math.random()*3; 
        if(randomNo > 0 && randomNo <=1){
            return 'Bat';
         }
        else if(randomNo > 1 && randomNo <=2){
            return 'Ball';
        }
        else{
            return 'Stump';
        }
        }

        function getResult(userMove,computerMove){
            if(userMove === 'Bat'){
                if(computerMove == 'Ball'){
                    score.win++;
                    return 'User won';

                }
                else if(computerMove == 'Bat'){
                    return 'Draw Match';
                    score.tie++;
                    
                }
                else {
                    score.loss++;
                    return 'Computer Won';
                    
                }
            }
            else if(userMove === 'Ball'){
                if(computerMove == 'Ball'){
                    score.tie++;
                    return 'Draw Match';
                    
                }
                else if(computerMove == 'Bat'){
                    score.loss++;
                    return 'Computer Won';
                    
                }
                else {
                    score.win++;
                    return 'User Won';
                    
                }
            }
            else{
                if(computerMove == 'Ball'){
                    score.tie++;
                    return 'Draw Match';
                    
                }
                else if(computerMove == 'Bat'){
                    score.loss++;
                    return 'Computer Won';
                    
                }
                else {
                    score.win++;
                    return 'User Won';
                    
                }
            }
        }
        function showResult(userMove,computerMove,result){
            console.log(score);
        alert(`you have chosen ${userMove}, and computer chosen ${computerMove},
            ${result}. 
            ${score.displayScore()}`)
        }
    </Script>
</body>
</html>
