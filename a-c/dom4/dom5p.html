<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>dom5</title>
</head>
<body>

    <script>
        let newheading = document.querySelector('h1')
        newheading.innerText = 'i am a new heading'

        document.querySelector('h1').prepend(newheading)
    </script>
</body>
</html>
