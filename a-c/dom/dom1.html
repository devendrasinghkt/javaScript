<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dom</title>
    <style>
    h1{
        color: blue;
        text-decoration: line-through;
    }
    #heading{
        background-color: aquamarine;
    }
    .heading-class{
        background-color: lightpink;
    }
    </style>
</head>
<body>
    <h1 id="heading">DOM Demo by Apna College</h1>
    <h4>topic 1 : Starter code</h4>
    <p class="heading-class">Let's learn about dom concepts in details</p>
    <p>Lorem ipsum dolor sit amet consectetur adipisicing elit. Dolorum ipsa libero sit distinctio dignissimos.</p>
    <button class="heading-class">click me!</button>
    <button id="my-id">button</button>
    <script>
    let heading = document.getElementById("heading")
    console.dir(heading)

    let headingClass = document.getElementsByClassName("heading-class")
    console.dir(headingClass)
    console.log(headingClass)

    let para = document.getElementsByTagName("p")
    para.innerText = "hello";
    console.dir(para)
    console.log(para)

    let firstEl = document.querySelector('#my-id')
    console.dir(firstEl)
    </script>
</body>
</html>
