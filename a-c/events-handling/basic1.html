<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>basic</title>
  <style>
    .box{
      height: 100px;
      width: 100px;
      background-color: dodgerblue;
      color: white;
      border: 2px solid black;

    }
  </style>
</head>
<body>
  <button onclick="console.log('button was clicked'); alert('hello')">click me</button>
  <button ondblclick="console.log('button was clicked 2x')">click me 2 times</button>
  <div class="box" onmouseover="console.log('you are inside in div')">This is a box</div>
</body>
</html>
