<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
      let sum = function(num1,num2){
        return num1 + num2;
      }  
      console.log(sum(4,3));


      let sum1 = (num1,num2) => {
        return num1 + num2;             // new way fn
      }
      console.log(sum1(3,5));


      let sq = num => {
        return num * num;
      }
      console.log(sq(3));

      let square = n => n*n;
      console.log(square(4));
    </script>
</body>
</html>
