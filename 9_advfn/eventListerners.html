<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <!-- <button id="my-button"
     onclick="console.log('i am clicked');">Click Me</button> -->

     <!-- alternate way -->
      <button id="my-button">Clicked Me</button>

      <script>
        let buttonElement = document.querySelector('#my-button');
        let behaviour = addEventListener('click',event =>
            console.log('I am clicked button ')
        )
        let printDate = event => console.log(new Date());
        addEventListener('click',printDate);

        buttonElement = removeEventListener('click',behaviour);
      </script>
</body>
</html>
