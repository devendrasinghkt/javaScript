<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>forEach</title>
</head>
<body>
    <script>
        let foods = [2,3,5,32];
        for(let i=0;i<foods.length;i++){
            console.log(foods[i]);
        }
        foods.forEach(function(i){
            console.log(i);
        });
    </script>
</body>
</html>
