<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

<body>
    <script>
        // console.log(console) to show method in console
        console.log("hello")
        console.error("hello error")
        console.assert(1<22)
        // console.clear()
        obj = {a:1,b:2,c:3}
        console.table(obj)
        console.warn("hello")
        console.info("hello")

        //imp 
        // console.time()
        console.time("a")
        console.timeEnd("a")

        console.time("for loop")
        for(let i = 0;i<5;i+i++){
            console.log(233)
        }
        console.timeEnd("for loop")

        console.time("while loop")  //st time
        let r=0
        while(r<5){
            console.log(233)
            r++
        }
        console.timeEnd("while loop")    //end time




        
    </script>
