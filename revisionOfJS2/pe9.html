        console.log('Qustion 3'); //question 3 Part 2
        
        let num = localStorage.getItem(('num') || 0) ;
        function onpressed(){
            num++;
            localStorage.setItem('num',num); // string convert into string also for local storage
            updateButton();
        }
        function updateButton(){
            let button = document.querySelector('#display-button'); 
            if(num%2==0){
                button.classList.remove('odd-js');
                button.classList.add('even-js');

            }
            else{
                button.classList.remove('even-js');
                button.classList.add('odd-js');
            }
            button.innerText = (num);
        }
        updateButton();
