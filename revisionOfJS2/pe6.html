<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1 id="display">Discount is ?</h1>
    <script>
        let discount;
        let age = 34;
        let gender = 'female';
        if(age<=5){
            discount = 100;
            document.querySelector('#display').innerText = (`Discount is ${discount} %`);
        }
        else if (age<=8 || gender=='female') {
            discount = 50;
            document.querySelector('#display').innerText = (`Discount is ${discount} %`);
        }
        else if(age>65){
            discount = 30;
            document.querySelector('#display').innerText = (`Discount is ${discount} %`);
        }
        else {
            discount = 0;
            document.querySelector('#display').innerText = (`Discount is ${discount} %`);
        }
        
    </script>
</body>
</html>
