<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .btn1{
            margin-left: 5px;
            padding: 12px 12px 12px 12px;
            border-radius: 7px;
            border: none;
            background-color: lightgreen;
        }
    </style>
</head>
<body>
    <div class="container">
        <button class="btn1" onclick="count++;
        document.querySelector('#display').innerText=(`Your bag has ${count} items`);">Add to bag</button>
        <button style="background-color: white; border: 2px solid black;" class="btn1" onclick="count--;
        document.querySelector('#display').innerText=(`Your bag has ${count} items`);">❤️ Move to Wishlist</button>
        <button class="btn1" onclick="count+=2;
        document.querySelector('#display').innerText=(`Your bag has ${count} items`);">Add to sale item </button>
    </div>
    <h1 id="display">Your bag has "0" items </h1>
    <script>
        let count = '';

    </script>
</body>
</html>
