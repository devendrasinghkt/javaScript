        //question 5
        let product = {
            name: 'pant',
            variety : 'jeans',
            style : 'modern',
            'delivery-time' : 'same day delivery',
        }
        let product2 ={
            name: 'shirt',
            variety : 'jeans',
            style : 'modern',
            'delivery-time' : 'next day delivery',
        }
        let product3 = {
            name: 'shirt',
            variety : 'jeans',
            style : 'modern',
            'delivery-time' : 'next day delivery',
        }
        function isIdenticalProduct(product,product2){
            if(typeof product !== 'object' || typeof product2 !== 'object'){
                console.log('perimeter is not passed as object');
                return false;
            }
            else if(product.name === product2.name &&
                product.style === product2.style && 
                product.variety === product2.variety &&
                product['delivery-time'] === product2['delivery-time'] ) {
                
                return true;
            }
            else {
                return false;
            }
        }
        console.log(isIdenticalProduct(product,product2));
        console.log(isIdenticalProduct(product,''));
        console.log(isIdenticalProduct(product,product3));
        console.log(isIdenticalProduct(product2,product3));
        
    </script>
