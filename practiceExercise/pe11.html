<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pe11</title>
    <style>
        .grow-button{
            background-color: rgb(245, 120, 120);
            font-size: 15px;
            height: 20px;
            width: 120px;
        }
        .js-size-double{
            font-size: 30px;
            height: 40px;
            width: 240px;
        }
        .behaviour-btn{
            background-color: rgb(147, 109, 59);
            font-size: 15px;
            height: 20px;
            width: 120px;
        }
        .js-behaviour{
            font-size: 30px;
            height: 40px;
            width: 240px;
        }
    </style>
</head>
<body>
    <button class="grow-button " onclick="setTimeout(doubleTheSize , 2000);
    ">Grow button</button>
    <button><span class="behaviour-btn">Question 4</span></button>
    <script>
        //question 1
        let multiply = ((num1,num2) => {
          return  num1 * num2 });
        console.log(multiply(3,4));

        //question 2
        let printGreeting = () => console.log(
            'Namesta'
        )
        let runTwice = inputFunction => {
            inputFunction();
            inputFunction();
        };
        runTwice(printGreeting);

        //question 3
        function doubleTheSize(){
            let buttonElement = document.querySelector('.grow-button');
            buttonElement.classList.add('js-size-double');
        }

        //question 4
        function addBehaviour(){
            let buttonElement = document.querySelector('.behaviour-btn');
            buttonElement.classList.add('js-behaviour');
        }
        
        let buttonElement = document.querySelector('.behaviour-btn');
        buttonElement.addEventListener('click',event => {
            setTimeout(addBehaviour,2000)
        })

        //question 5
        
        let arr = [1,3,4,5,22];
        let sum = 0;
        arr.forEach (num =>  sum = sum+num ); 
        console.log(sum);
        // this question expendation form 
        //arr.forEach ((num) => { sum = sum+num}); is is function

        //question 6
        let arr2 = [2,4,6,7];
        let  sq = arr2.map(num => num*num);
        console.log(sq);

        
        
    </script>
</body>
</html>
