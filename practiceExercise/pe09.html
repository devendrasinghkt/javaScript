<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <style>
        .even-js{

        .odd-js{
            background-color: red;

<body>
    <h1 id="greeting"></h1>
    <h1 id="greetNameDisplay"></h1>
    <h1><button onclick="onPressed();" id="buttonDisplay">0</button></h1>
    <script>
        //question 1 
        let date = new Date();
        let hours = date.getHours();
        // let hours = 21;
        console.log(hours);
        if(hours >= 12 && hours<=17) {document.querySelector('#greeting').innerText = ('good Afternoon');}
        else if(hours>=18 && hours <=20) {document.querySelector('#greeting').innerText = ('good Evening');}
        else if(hours>=21 && hours <=23) {document.querySelector('#greeting').innerText = ('good night');}
        else if(hours>=0 && hours <=11) {document.querySelector('#greeting').innerText = ('good Morning');}
        else {document.querySelector('#greeting').innerText=('Impropriate msg ');}

        //question 2
        function greetName(name){
            if(hours >= 12 && hours<=17){
                return 'Good Afternoon '+ name;
            }
            else if(hours>=18 && hours <=20){
                return 'Good evening '+ name;
            }
            else if(hours>=21 && hours <=23){
                return 'Good night '+ name;
            }
            else if(hours>=0 && hours <=11){
                return 'Good good morning '+ name;
            }
            
        }
        let result = (greetName('Devendra Singh'));
        console.log( result);
        document.querySelector('#greetNameDisplay').innerText = result;

        // //question 3 
        // let count = 0;
        // function onPressed(){
        //     count++;
        //     let button = document.querySelector('#buttonDisplay');
        //     if(count%2==0){
        //         button.classList.remove('odd-js');
        //         button.classList.add('even-js')
        //     }
        //     else{
        //         button.classList.add('odd-js');
        //         button.classList.remove('even-js')
        //     }
        //     button.innerText = count;
        // }

        let count = localStorage.getItem(('count') || 0);
        function onPressed(){
            count++;
            localStorage.setItem('count',count)
            let button = document.querySelector('#buttonDisplay'); // string convert into string also for local storage
            updateButton();
        }
        function updateButton(){
            let button = document.querySelector('#buttonDisplay');
            if(count%2==0){
                button.classList.remove('odd-js');
                button.classList.add('even-js')
            }
            else{
                button.classList.add('odd-js');
                button.classList.remove('even-js')
            }
            button.innerText = count;
        }
        updateButton(); // without this use all work but refresh proplem show only (not a big deals.)
    </script>
</body>
