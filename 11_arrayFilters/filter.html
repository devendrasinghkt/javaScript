<body>
    <script>
        let arr = [1,2,3,4,5,6,7,8,9];
        let odds = arr.filter((num,index) => {
            if(num %2==1){
                return false;
            }
            else {
               return true; 
            }
        });
        
        //better way 
        let newOdds = arr.filter((num,index) => {
            return num % 2 === 1;

        });

        console.log(odds);
        console.log(newOdds);
    </script>
