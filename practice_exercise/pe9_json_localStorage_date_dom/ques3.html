<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>question-3</title>
    <style>
        #my-button {
            width: 50px;
            height: 50px;
            font-size:25px;
        }
        .js-odd{
            background-color: green;
        }
        .js-even{
            background-color: orange;
        }

    </style>
</head>
    
    <button id="my-button" onclick="buttonPressed();">0</button>

<body>
    
    <script>

        let noOfTimesClick = 0;
        function buttonPressed(){
            let button = document.querySelector('#my-button');
            noOfTimesClick++;
            if(noOfTimesClick%2==0){
                button.classList.remove('js-odd');
                button.classList.add('js-even');
            }
            else{
                button.classList.remove('js-even');
                button.classList.add('js-odd');
            }
            button.innerText = noOfTimesClick;
        }

    </script>
</body>
</html>
