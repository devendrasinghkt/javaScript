        }
        .wish-button{
            padding: 5px 35px ;

            background-color: white;
            border: 3px solid black;
            border-radius: 15px;
        }

    </style>

<body>
    <div id="button_page">
        <button class="bag-button" onclick="cartquantity ++; document.querySelector('#cart-summary').innerText =`Your bag has  ${cartquantity}   items`;" 
        >Add to Bag</button>
        <button class="wish-button" onclick="cartquantity--;document.querySelector('#cart-summary').innerText =`Your bag has  ${cartquantity}   items`;"> 
        Move to Wishlist    </button>
        <button class="bag-button" onclick="cartquantity+=2;document.querySelector('#cart-summary').innerText=`Your bag has ${cartquantity} items`;">Add 1 sale item</button>
    </div>
    <h1 id="cart-summary">Your bag has 0 items</h1>
