<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Todo app</title>
    <style>
        body{
            font-family: Arial, Helvetica, sans-serif;
        }
        #main-heading{
            text-align: center;
        }
        .grid-container{
            display: grid;
            grid-template-columns: 200px 150px 100px;
            column-gap: 10px;
            row-gap: 10px;
            margin-top: 10px;
            align-items: center;

        }
        #todo-input,#todo-input{
            font-size: 15px;
            padding: 10px 5px;

        }
        .btn-delete{
            background-color: rgb(185, 15, 15);
            color: white;
            border:none;
            padding: 15px 0px;
            cursor: pointer;
        }
        .btn-todo{
            background-color: rgb(37, 171, 43);
            color: white;
            border:none;
            padding: 15px 0px;
            cursor: pointer;
        }

        
    </style>
</head>
<body>
    
    <h1 id="main-heading">Todo App</h1>
    <div class="grid-container">
        <input id="todo-input" type="text" placeholder="Enter Todo here">
        <input id="todo-date" type="date" >
        <button class="btn-todo" onclick="addTodo()">Add</button>
    </div>
    

    <div class="todo-container grid-container"></div>

    

    <p class="todo-items"></p>
    
    

    <script>
        let todoList = [
            {
                item: 'Buy milk',     // array object
                dueDate:'4/10/26'
            },
            {
                item:'go to college',
                dueDate:'05/10/26'
            }
        ];
        displayItems();

        function addTodo(){
            let inputElement = document.querySelector('#todo-input');
            let dateElement = document.querySelector('#todo-date');
            let todoItem = inputElement.value;
            let todoDate = dateElement.value;
            todoList.push({item: todoItem,dueDate: todoDate});
            inputElement.value = '';
            dateElement.value = '';
            displayItems();
        } 

        function displayItems(){
            let containerElement = document.querySelector('.todo-container');
            let newHtml = '';
            for(let i = 0;i<todoList.length;i++){
                // let item = todoList[i].item;
                // let dueDate = todoList.dueDate;
                let {item,dueDate} = todoList[i];
                newHtml += `
                
                    <span>${item}</span>
                    <span>${dueDate}</span>
                    <button class="btn-delete" onclick = "todoList.splice(${i},1);
                    displayItems();"
                    >Delete</button>
                
                `;
                // displayElement.innerText = displayElement.innerText + "\n" + todoList[i];
            }
            containerElement.innerHTML = newHtml;
        }
         
        
    </script>
</body>
</html>
